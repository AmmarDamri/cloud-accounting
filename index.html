<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Cloud Accounting Software</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">📊 Simple Cloud Accounting</h1>
            <p class="text-slate-500 mt-1">Apna hisab-kitaab Google Drive ke sath har device par sync rakhein</p>
        </header>

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">Total Balance</p>
                <h3 id="netBalance" class="text-2xl font-bold text-slate-800 mt-1">Rs. 0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-emerald-600">Total Income</p>
                <h3 id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">Rs. 0</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-rose-600">Total Expense</p>
                <h3 id="totalExpense" class="text-2xl font-bold text-rose-600 mt-1">Rs. 0</h3>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Transaction Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 md:col-span-1">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Nayi Entry Karein</h2>
                <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
                        <input type="text" id="desc" required placeholder="Misal: Office Rent, Sale..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Amount (Rs.)</label>
                        <input type="number" id="amount" required placeholder="0.00" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Type</label>
                        <select id="type" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            <option value="income">Income (Aamdani)</option>
                            <option value="expense">Expense (Kharcha)</option>
                        </select>
                    </div>
                    <button type="submit" id="saveBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm">Save Entry</button>
                </form>
            </div>

            <!-- Transactions History Table -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 md:col-span-2">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Transactions History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase">
                                <th class="pb-3">Description</th>
                                <th class="pb-3">Type</th>
                                <th class="pb-3 text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-slate-50 text-sm">
                            <tr>
                                <td colspan="3" class="py-4 text-center text-slate-400">Loading data from Google Cloud...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ⚠️ PEHLE APNA GOOGLE APPS SCRIPT WEB APP URL YAHAN PASTE KAREIN
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxoK1gPs8q3A2_FcMZQEuxMoxOruJsXh8IG_PYI_VdNH0UEexmu89l6H2e8AgXVcNb-Q/exec';

        let transactions = [];

        // Google Sheet se data fetch karne ka function
        async function fetchTransactions() {
            if (SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbzQH_m_HpqBcVyb7alu2EQSjjgq8_ltSjCrkeLVpkH23MgcG_jeE49sBpJtVH1o_WnN0w/exec') {
                document.getElementById('transactionList').innerHTML = `
                    <tr>
                        <td colspan="3" class="py-4 text-center text-rose-500 font-medium">
                            Meharbani karke SCRIPT_URL mein apna Google Apps Script Web App URL daalein!
                        </td>
                    </tr>`;
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL);
                transactions = await res.json();
                updateUI();
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

            const netBalanceEl = document.getElementById('netBalance');

            }

                if (t.type === 'income') {
                    income += Number(t.amount);
